plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'org.example'

sourceCompatibility = '21'
targetCompatibility = '21'
mainClassName = 'org.example.TodoApp' // for 'application' plugin

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('todo-app')
    archiveClassifier.set('') // no classifier: produce todo-app-<version>.jar
    archiveVersion.set(project.version.toString())
    mergeServiceFiles()
}

tasks.jar {
    enabled = false
}

tasks.named('distZip') { Task it ->
    dependsOn tasks.named('shadowJar')
}

tasks.named('distTar') { Task it ->
    dependsOn tasks.named('shadowJar')
}

tasks.named('startScripts') { Task it ->
    dependsOn tasks.named('shadowJar')
}

tasks.named('startShadowScripts') { Task it ->
    dependsOn tasks.named('jar')
}

tasks.build {
    dependsOn shadowJar
}
